- name: Install prerequisites apt packages
  apt:
    name: ['python3-debian', 'python3-pip', 'python3-setuptools', 'gnupg', 'zip']
    state: present
    update_cache: yes
  become: yes

- name: Add Additional Debian repo in testing
  become: true
  when: ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_release'] == "forky"
  block:
    - name: Add Debian unstable deb822 repo (separate .sources file)
      deb822_repository:
        name: debian-unstable
        types: deb
        uris: "http://ftp.udx.icscoe.jp/Linux/debian"
        suites: unstable
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present
    - name: Add apt pinning for testing/unstable
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/00-testing-unstable
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: *
          Pin: release a=testing
          Pin-Priority: 900

          Package: *
          Pin: release a=unstable
          Pin-Priority: 100

- name: Add Additional Debian repo in trixie
  become: true
  when: ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_major_version'] == "13"
  block:
    - name: Add Debian unstable deb822 repo (separate .sources file)
      deb822_repository:
        name: debian-testing
        types: deb
        uris: "http://ftp.udx.icscoe.jp/Linux/debian"
        suites: testing
        components: [main, contrib, non-free, non-free-firmware]
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present
    - name: Add apt pinning for testing/unstable
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/00-trixie-testing
        owner: root
        group: root
        mode: "0644"
        content: |
          Package: *
          Pin: release a=trixie
          Pin-Priority: 900

          Package: *
          Pin: release a=testing
          Pin-Priority: 100

- name: Install apt packages
  apt:
    name: ['attr', 'autoconf', 'bat', 'black', 'ccache', 'clang-format', 'clang-tidy', 'clangd', 'cmake-format', 'command-not-found', 'dbus-x11', 'dconf-cli', 'dnsutils', 'elpa-anzu', 'elpa-cmake-mode', 'elpa-company', 'elpa-compat', 'elpa-corfu', 'elpa-diff-hl', 'elpa-diminish', 'elpa-dockerfile-mode', 'elpa-doom-themes', 'elpa-dpkg-dev-el', 'elpa-editorconfig', 'elpa-eglot', 'elpa-find-file-in-project', 'elpa-format-all', 'elpa-helm', 'elpa-helm-ag', 'elpa-hl-todo', 'elpa-ligature', 'elpa-magit', 'elpa-markdown-mode', 'elpa-migemo', 'elpa-powerline', 'elpa-py-isort', 'elpa-rust-mode', 'elpa-use-package', 'elpa-vterm', 'elpa-which-key', 'elpa-yaml-mode', 'elpa-yasnippet', 'emacs', 'emacs-mozc', 'expect', 'fonts-powerline', 'gdb', 'git-lfs', 'gnome-sushi', 'grc', 'htop', 'ipython3', 'isort', 'jq', 'kcachegrind', 'lsb-release', 'massif-visualizer', 'mold', 'net-tools', 'ninja-build', 'nmap', 'npm', 'pandoc', 'peco', 'pipx', 'pre-commit', 'python3-debugpy', 'python3-ipython', 'python3-pylsp', 'python3-pylsp-black', 'python3-venv', 'quilt', 'rlwrap', 'rustup', 'shellcheck', 'shfmt', 'texlive-extra-utils', 'tig', 'tidy', 'tmux', 'traceroute', 'util-linux', 'valgrind', 'wl-clipboard', 'xsel', 'zsh', 'zsh-autosuggestions', 'zsh-syntax-highlighting']
    state: present
    update_cache: yes
  become: yes

- name: Ensure keyrings directory exists
  become: true
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install 3rdparty GUI repositories
  become: true
  when: not ('WSLENV' in ansible_env)
  block:
    - name: Download Google Chrome GPG Key
      get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: '0644'
      when: ansible_architecture != "aarch64"
    - name: Add Google Chrome repository
      deb822_repository:
        name: google-chrome
        types: deb
        uris: http://dl.google.com/linux/chrome/deb/
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/google-chrome.asc
      when: ansible_architecture != "aarch64"
    - name: Download Microsoft GPG Key
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: '0644'
    - name: Add VS Code repository
      deb822_repository:
        name: vscode
        types: deb
        uris: https://packages.microsoft.com/repos/code
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/microsoft.asc
    - name: Install 3rdparty GUI packages
      apt:
        name: "{{ ['code', 'google-chrome-stable'] if ansible_architecture != 'aarch64' else ['code'] }}"
        state: present
        update_cache: yes

- name: Install Docker
  become: true
  when: not (ansible_facts['distribution'] == "Debian" and ansible_facts['distribution_major_version'] != "14")
  block:
    - name: Download Docker GPG Key
      get_url:
        url: https://download.docker.com/linux/{{ ansible_distribution|lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
    - name: Add Docker repository
      deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/{{ ansible_distribution|lower }}
        suites: "{{ ansible_distribution_release }}"
        components: stable
        signed_by: /etc/apt/keyrings/docker.asc
    - name: Install Docker
      apt:
        name: ['docker-ce', 'docker-ce-cli', 'containerd.io', 'docker-buildx-plugin', 'docker-compose-plugin']
        state: present
        update_cache: yes

- name: Install ROS 2 Jazzy
  become: true
  when: ansible_facts['distribution'] == "Ubuntu" and ansible_facts['distribution_release'] == "noble"
  block:
    - name: Enable universe repository
      apt_repository:
        repo: "deb http://{{ 'ports.ubuntu.com/ubuntu-ports' if ansible_architecture == 'aarch64' else 'archive.ubuntu.com/ubuntu' }} {{ ansible_distribution_release }} universe"
        state: present
    - name: Install software-properties-common
      apt:
        name: software-properties-common
        state: present
    - name: Get latest ros2-apt-source version
      uri:
        url: https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest
        return_content: true
      register: ros_apt_source_release
      changed_when: false
    - name: Download ros2-apt-source deb
      get_url:
        url: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros_apt_source_release.json.tag_name }}/ros2-apt-source_{{ ros_apt_source_release.json.tag_name }}.{{ ansible_distribution_release }}_all.deb"
        dest: /tmp/ros2-apt-source.deb
    - name: Install ros2-apt-source deb
      apt:
        deb: /tmp/ros2-apt-source.deb
    - name: Install ROS 2 Jazzy packages
      apt:
        name: ['python3-rocker', 'python3-vcs2l', 'ros-dev-tools', 'ros-jazzy-desktop-full']
        state: present
        update_cache: yes

- name: Install GitHub CLI
  become: true
  block:
    - name: Download GitHub CLI GPG Key
      get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
        mode: '0644'
    - name: Add GitHub CLI repository
      deb822_repository:
        name: github-cli
        types: deb
        uris: https://cli.github.com/packages
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    - name: Install GitHub CLI
      apt:
        name: gh
        update_cache: yes
        state: present
    - name: Add gh zsh completion
      shell: gh completion -s zsh > /usr/local/share/zsh/site-functions/_gh

- name: Install Claude Code
  become: true
  block:
    - name: Download Claude Code ASC Key
      get_url:
        url: https://downloads.claude.ai/keys/claude-code.asc
        dest: /etc/apt/keyrings/claude-code.asc
        mode: '0644'
    - name: Add Claude Code repository
      deb822_repository:
        name: claude-code
        types: deb
        uris: https://downloads.claude.ai/claude-code/apt/stable
        suites: stable
        components: main
        signed_by: /etc/apt/keyrings/claude-code.asc
    - name: Install Claude Code
      apt:
        name: claude-code
        update_cache: yes
        state: present

- name: Install Copilot
  become: true
  community.general.npm:
    name: '@github/copilot-language-server'
    global: true
