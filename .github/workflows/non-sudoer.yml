name: non-sudoer
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y pipx xsel
      - name: Test limited setup
        run: |
          export HOME="$RUNNER_TEMP/non-sudoer-home"
          mkdir -p "$HOME"
          export PATH="$HOME/.local/bin:$PATH"
          ./setup_nonsudoer
          ./setup_nonsudoer
          test -L "$HOME/.bashrc"
          test -L "$HOME/.emacs"
          test -L "$HOME/.tmux.conf"
          percol --help
