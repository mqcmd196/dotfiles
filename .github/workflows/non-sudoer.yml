name: non-sudoer
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    name: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pipx xsel
      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install pipx
      - name: Test limited setup
        run: |
          export HOME="$RUNNER_TEMP/non-sudoer-home"
          mkdir -p "$HOME"
          export PATH="$HOME/.local/bin:$PATH"
          ./setup_nonsudoer
          ./setup_nonsudoer
          test -L "$HOME/.bashrc"
          test -L "$HOME/.emacs"
          test -L "$HOME/.tmux.conf"
          percol --help
          if [[ "$RUNNER_OS" == macOS ]]; then test ! -e "$HOME/.local/src/xsel"; fi
